global:
  scrape_interval: 15s
  evaluation_interval: 30s

remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: local

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  
  # - job_name: 'promtail'
  #   static_configs:
  #     - targets: ['promtail:']
  
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
  
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9090']
    
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'tempo-usage-metrics'
    metrics_path: '/usage_metrics'
    static_configs:
      - targets: ['tempo:3200']
