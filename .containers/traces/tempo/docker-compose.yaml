
services:
  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo
    restart: unless-stopped
    networks:
      - stack-network
    ports:
      - "3200:3200"  # Expose Tempo HTTP API
      - "4317"       # OTLP gRPC
      - "4318"       # OTLP HTTP
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

volumes:
  tempo-data:
