# Redis configuration for local development

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
pidfile /var/run/redis.pid
logfile ""
databases 16

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Append-only file (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Performance / Dev options
io-threads 2
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Enable keyspace events (optional, for debugging or Pub/Sub)
notify-keyspace-events Ex
