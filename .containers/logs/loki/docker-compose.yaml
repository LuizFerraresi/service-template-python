
services:
  loki:
    image: grafana/loki:3.5
    container_name: loki
    restart: unless-stopped
    networks:
      - stack-network
    ports:
      - "3100:3100"
    volumes:
      - ./config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml

volumes:
  loki_data:
