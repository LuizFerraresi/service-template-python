
services:
  redis-insights:
    image: redislabs/redisinsight:latest
    container_name: redis-insights
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Optional: configure data storage path inside container
      - REDIS_INSIGHT_DATABASE_PATH=/db
    volumes:
      - redisinsights_data:/db
      - ./redisinsights.conf:/opt/redislabs/redisinsight/conf/redisinsight.conf:ro  # optional custom config
    networks:
      - redis-network

volumes:
  redisinsights_data:

networks:
  redis-network:
    external: false
