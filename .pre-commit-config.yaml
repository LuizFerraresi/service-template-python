repos:
    # Check if pre-commit is up-to-date
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.5.1post1
    hooks:
      - id: pre-commit-update

    # Pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # enforce github rule
      - id: no-commit-to-branch
        args: [--branch, main]

      # check files
      - id: check-toml
      - id: check-yaml
      - id: check-json

      # format files
      - id: pretty-format-json
        args: ["--autofix"]

      # check code
      - id: debug-statements
      - id: end-of-file-fixer

      # check tests
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: tests/data/

  # lock dependencis
  # - repo: https://github.com/python-poetry/poetry
  #   rev: 1.8.3
  #   hooks:
  #     - id: poetry-check
  #     - id: poetry-lock

  # Bandit for security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['--configfile', 'pyproject.toml', '--recursive', '.']

  # 3. Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        args: ["--config", "pyproject.toml"]
      - id: ruff-format
        args: ["--check", "--config", "pyproject.toml"]

  # 4. Pyright for type checking
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.405
    hooks:
      - id: pyright
        args: ["--project", "pyproject.toml"]
